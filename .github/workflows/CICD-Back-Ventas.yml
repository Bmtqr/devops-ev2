name: CI/CD - Backend Ventas

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "back-Ventas_SpringBoot/**"

jobs:
  build-push-deploy-ventas:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Back-Ventas y push a ECR
      run: |
        cd back-Ventas_SpringBoot/Springboot-API-REST
        docker build -t ms-ventas .
        docker tag ms-ventas:latest ${{ secrets.ECR_REPO_URL_VENTAS }}:latest
        docker push ${{ secrets.ECR_REPO_URL_VENTAS }}:latest

    - name: Desplegar Backend Ventas vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_VENTAS_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar ms-ventas desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "docker pull ${{ secrets.ECR_REPO_URL_VENTAS }}:latest",
            "docker stop ms-ventas || true",
            "docker rm ms-ventas || true",
            "docker run -d --name ms-ventas -p 18081:18081 --restart unless-stopped -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} -e DB_PORT=${{ secrets.DB_PORT }} -e DB_NAME=${{ secrets.DB_NAME_VENTAS }} -e DB_USERNAME=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ secrets.ECR_REPO_URL_VENTAS }}:latest"
          ]}' \
          --output text
